# Internal-only now - no TLS, no public port here. A shared edge-nginx
# (outside this project, in front of every project on the VPS) terminates
# HTTPS on 80/443 and forwards plain HTTP to this container's port 80 on
# the shared `edge_network` docker network.
server {
    listen 80;
    server_name tracking.qutma.com;

    # Flutter Web Single Page App
    # Cache-Control here forces Cloudflare and browsers to always revalidate
    # with the origin instead of serving a stale build - Flutter web reuses
    # the same filenames (main.dart.js, etc.) on every build, so without this
    # a new deploy can go unnoticed by caches indefinitely.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Reverse Proxy for WebSockets (wss:// from the browser's point of view -
    # TLS is already terminated by edge-nginx before this container sees it)
    location /ws {
        # Only allow the handshake if it's coming from a browser tab
        # actually loaded from tracking.qutma.com (the Flutter web app's own origin).
        # Browsers always send this header on WebSocket handshakes, so this
        # blocks bare tools like wscat/curl run with no --origin flag.
        if ($http_origin != "https://tracking.qutma.com") {
            return 403;
        }

        proxy_pass http://gps-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Reverse Proxy for REST API
    location /api/ {
        proxy_pass http://gps-backend:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
