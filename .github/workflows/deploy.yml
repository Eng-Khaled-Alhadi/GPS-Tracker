name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # Resolve app directory (expand $HOME properly)
            APP_DIR="${{ secrets.SERVER_APP_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/GPS-Tracker"
            fi

            echo "📂 Navigating to $APP_DIR..."
            cd "$APP_DIR"

            echo "🚀 Fetching and pulling latest changes for branch ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "🐳 Rebuilding and restarting Docker containers with SERVER_HOST..."
            export SERVER_HOST="${{ secrets.SERVER_HOST }}"
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"

