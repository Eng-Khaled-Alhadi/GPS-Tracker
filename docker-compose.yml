services:
  mysql:
    image: mysql:8.0
    container_name: gps_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_NAME:-gps_tracker}

    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gps_network

  gps-backend:
    build:
      context: ./gps_tracker_backend
      dockerfile: Dockerfile
    container_name: gps_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gps_tracker}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "8000:8000"       # JT808 GPS Terminal TCP Port (must stay public for GPS hardware)
    expose:
      - "8081"            # REST & WebSocket Port - internal only, reached via gps-web's Nginx proxy
    networks:
      - gps_network

  gps-web:
    build:
      context: ./gps_tracker_app
      dockerfile: Dockerfile
      args:
        SERVER_HOST: ${SERVER_HOST:-176.45.55.56}
    container_name: gps_web

    restart: unless-stopped
    expose:
      - "80"               # internal only - edge-nginx reverse proxies to this
    networks:
      - gps_network         # to reach gps-backend for /ws and /api
      - edge_network        # to be reached by the shared edge-nginx


volumes:
  mysql_data:
    driver: local

networks:
  gps_network:
    driver: bridge
  edge_network:
    name: edge_network
    external: true         # created once on the host: docker network create edge_network

